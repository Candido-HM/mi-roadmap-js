<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onmouseout</title>
</head>
<body>
    <h1 id="titulo" onmouseover="rojo(this)" onmouseout="azul(this)">Eventos con mouse</h1>
    <br>
    <h2 onmousedown="rojo(this)" onmouseup="azul(this)" onclick="verde(this)">Otro titulo más</h2>
    <br>
    Nombre: <input type="text" onfocus="cambiar(this)" onblur="regresar(this)">
    <br> <br>
    Apellido: <input type="text" onfocus="cambiar(this)" onblur="regresar(this)">
    <script>
        function rojo(titulo) {
            console.log('Evento onmousedown rojo');
            titulo.style.color = 'red';
        }
        function azul(titulo){
            console.log('Evento onmouseout azul');
            titulo.style.color = 'blue';
        }
        function verde(titulo){
            console.log('Evento onclick verde');
            titulo.style.color = 'green';
        }
        function cambiar(elementoInput){
            elementoInput.style.background = 'yellow';
        }
        function regresar(elementoInput){
            elementoInput.style.background = 'white';
        }
    </script>
</body>
</html>
