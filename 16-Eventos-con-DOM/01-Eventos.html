<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos Js</title>
</head>
<body onload="entrar()">
    <!-- <h1 onclick="cambiarTexto(this)">Manejo de eventos</h1> -->
    <h1 id="titulo">Manejo de Evento</h1>
    <br>
    <div id="mostrar"></div>
    <script>
        // function cambiarTexto(titulo){
        //     console.log(titulo);
        //     console.log(titulo.innerHTML);
        //     titulo.innerHTML = 'Cambiamos el tìtulo';
        //     console.log(titulo.innerHTML);
        // }
        document.getElementById('titulo').onclick = cambiarTexto;

        function cambiarTexto() {
            document.getElementById('mostrar').innerHTML = 'Nuevo contenido';
        }

        function entrar(){
            alert('Entrando a la página web');
            let texto = '';
            if(navigator.cookieEnabled){
                texto = 'Cookies están habilitadas';
            } else {
                texto = 'Cookies están inhabilitadas';
            }
            document.getElementById('mostrar').innerHTML = texto;
        }
    </script>
</body>
</html>
